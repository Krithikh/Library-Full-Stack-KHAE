name: Materialize Fine Student Guides

on:
  push:
    branches: [ Student-Guides ]
    paths:
      - 'automation/docx-guides/generate_fine_guides.py'
      - '.github/workflows/commit-fine-guides.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-fine-guides
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Student-Guides
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-docx
        run: python -m pip install --disable-pip-version-check python-docx
      - name: Generate T56-T60 DOCX files
        run: python automation/docx-guides/generate_fine_guides.py
      - name: Commit generated guides
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KHAE Course Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Documents/Student-Guides/Fine
          if git diff --cached --quiet; then
            echo "Fine guides already match generator."
            exit 0
          fi
          git commit -m "GUIDES-T56-T60: add Fine student guide set [skip guides]"
          git fetch origin Student-Guides
          git rebase origin/Student-Guides
          git push origin HEAD:Student-Guides
