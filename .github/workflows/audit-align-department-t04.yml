name: Audit Align T04 Department Guide

on:
  push:
    branches: [ Student-Guides ]
    paths:
      - 'automation/docx-guides/postprocess_department_t04_audit_alignment.py'
      - '.github/workflows/audit-align-department-t04.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-align-department-t04
  cancel-in-progress: false

jobs:
  align-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Student-Guides
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-docx
        run: python -m pip install --disable-pip-version-check python-docx
      - name: Align T04 guide to audited seed
        run: python automation/docx-guides/postprocess_department_t04_audit_alignment.py
      - name: Commit aligned T04 guide
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KHAE Course Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Documents/Student-Guides/Department/T04_Deactivate_Department
          if git diff --cached --quiet; then
            echo "T04 guide is already aligned."
            exit 0
          fi
          git commit -m "GUIDES-T04: align Deactivate Department success row to final audited seed [skip guides]"
          git fetch origin Student-Guides
          git rebase origin/Student-Guides
          git push origin HEAD:Student-Guides
