name: Materialize Membership Student Guides

on:
  push:
    branches: [ Student-Guides ]
    paths:
      - 'automation/docx-guides/generate_membership_guides.py'
      - '.github/workflows/commit-membership-guides.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Student-Guides
        uses: actions/checkout@v4
        with:
          ref: Student-Guides
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DOCX dependency
        run: python -m pip install --disable-pip-version-check python-docx

      - name: Generate T36-T40 Membership DOCX guides
        run: python automation/docx-guides/generate_membership_guides.py

      - name: Commit generated Word documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KHAE Course Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Documents/Student-Guides/Membership
          if git diff --cached --quiet; then
            echo "Membership guides already match the generator."
            exit 0
          fi
          git commit -m "GUIDES-T36-T40: add Membership student guide set"
          git push origin HEAD:Student-Guides
