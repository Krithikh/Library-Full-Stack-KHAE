name: Rechain Generated Baseline After Guide Updates

on:
  push:
    branches: [ Student-Guides ]
    paths:
      - 'Documents/Student-Guides/**'
      - '.github/workflows/rechain-generated-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rechain-frontend-backend-baseline
  cancel-in-progress: false

jobs:
  rechain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          ref: Student-Guides
          fetch-depth: 0

      - name: Fetch generated baseline
        run: git fetch origin Frontend-backend-Baseline:refs/remotes/origin/Frontend-backend-Baseline

      - name: Replay generated-code delta on latest guide commit
        shell: bash
        run: |
          set -euo pipefail
          GUIDES="$(git rev-parse HEAD)"
          BASE="$(git rev-parse refs/remotes/origin/Frontend-backend-Baseline)"
          COMMON="$(git merge-base "$GUIDES" "$BASE")"
          echo "Latest Student-Guides: $GUIDES"
          echo "Current generated baseline: $BASE"
          echo "Previous shared guide base: $COMMON"
          git diff --binary "$COMMON" "$BASE" > /tmp/generated-code.patch
          git checkout -B regenerated-baseline "$GUIDES"
          if [ -s /tmp/generated-code.patch ]; then
            git apply --index --3way /tmp/generated-code.patch
          fi
          git config user.name "KHAE Course Automation"
          git config user.email "actions@users.noreply.github.com"
          if git diff --cached --quiet; then
            NEW_HEAD="$GUIDES"
          else
            git commit -m "BASE-RECHAIN: replay generated application on latest Student-Guides"
            NEW_HEAD="$(git rev-parse HEAD)"
          fi
          git push --force-with-lease origin "$NEW_HEAD:Frontend-backend-Baseline"

# Touch marker: T01-T60 audit synchronization
