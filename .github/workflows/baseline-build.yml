name: Verify Student Baseline

on:
  push:
    branches: [ Frontend-backend-Baseline ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: library_full_stack
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d library_full_stack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run Spring Boot baseline tests with PostgreSQL
        working-directory: backend/backend.lib.mgmt
        shell: bash
        run: |
          set +e
          bash mvnw --batch-mode --no-transfer-progress test 2>&1 | tee /tmp/backend-maven.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          log = Path('/tmp/backend-maven.log').read_text(errors='replace').splitlines()
          useful = []
          markers = ('[ERROR]', 'Caused by:', 'Exception', 'Flyway', 'Schema-validation', 'BUILD FAILURE')
          for line in log:
              if any(marker in line for marker in markers):
                  useful.append(line.strip())
          if not useful:
              useful = log[-40:]
          message = ' | '.join(useful[-20:])
          message = message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error title=Backend Maven Test Failure::{message[:7000]}')
          PY
            exit "$status"
          fi

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/frontend.lib.mgmt/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend/frontend.lib.mgmt
        run: npm ci
      - name: Build Vite frontend
        working-directory: frontend/frontend.lib.mgmt
        run: npm run build

