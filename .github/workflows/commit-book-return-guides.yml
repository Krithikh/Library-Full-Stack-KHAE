name: Materialize Book Return Student Guides

on:
  push:
    branches: [ Student-Guides ]
    paths:
      - 'automation/docx-guides/generate_book_return_guides.py'
      - 'automation/docx-guides/postprocess_book_return_audit_alignment.py'
      - '.github/workflows/commit-book-return-guides.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-book-return-guides
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Student-Guides
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-docx
        run: python -m pip install --disable-pip-version-check python-docx
      - name: Generate T46-T50 DOCX files
        run: python automation/docx-guides/generate_book_return_guides.py
      - name: Apply final T49 audit alignment
        run: python automation/docx-guides/postprocess_book_return_audit_alignment.py
      - name: Commit generated guides
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KHAE Course Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Documents/Student-Guides/Book-Return
          if git diff --cached --quiet; then
            echo "Book Return guides already match generator and audit alignment."
            exit 0
          fi
          git commit -m "GUIDES-T46-T50: align Book Return guides to final T01-T60 training data [skip guides]"
          git fetch origin Student-Guides
          git rebase origin/Student-Guides
          git push origin HEAD:Student-Guides
