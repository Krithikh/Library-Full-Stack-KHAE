name: Clean T41-T45 Student Guide Wording

on:
  push:
    branches: [ Student-Guides ]
    paths:
      - '.github/workflows/cleanup-t41-t45-student-wording.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Student-Guides
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check python-docx
      - name: Remove meta wording from generator and generated DOCX files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from docx import Document

          source = Path('automation/docx-guides/generate_book_issue_guides.py')
          text = source.read_text(encoding='utf-8')
          text = text.replace(
              'ISS-0005 / ACTIVE / Return RET-0003 COMPLETED - controlled intermediate workflow state',
              'ISS-0005 / ACTIVE / Return RET-0003 COMPLETED')
          text = text.replace(
              'ISS-0005 is a controlled intermediate workflow state:',
              'ISS-0005 shows an intermediate workflow state:')
          source.write_text(text, encoding='utf-8')

          root = Path('Documents/Student-Guides/Book-Issue')
          replacements = {
              'ISS-0005 / ACTIVE / Return RET-0003 COMPLETED - controlled intermediate workflow state':
                  'ISS-0005 / ACTIVE / Return RET-0003 COMPLETED',
              'ISS-0005 is a controlled intermediate workflow state:':
                  'ISS-0005 shows an intermediate workflow state:',
          }
          for path in root.rglob('*.docx'):
              doc = Document(path)
              changed = False
              for p in doc.paragraphs:
                  old = p.text
                  new = old
                  for a,b in replacements.items():
                      new = new.replace(a,b)
                  if new != old:
                      if p.runs:
                          p.runs[0].text = new
                          for r in p.runs[1:]:
                              r.text = ''
                      else:
                          p.text = new
                      changed = True
              for tbl in doc.tables:
                  for row in tbl.rows:
                      for cell in row.cells:
                          old = cell.text
                          new = old
                          for a,b in replacements.items():
                              new = new.replace(a,b)
                          if new != old:
                              cell.text = new
                              changed = True
              if changed:
                  doc.save(path)
          PY

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KHAE Course Automation"
          git config user.email "actions@users.noreply.github.com"
          git add automation/docx-guides/generate_book_issue_guides.py Documents/Student-Guides/Book-Issue
          git rm .github/workflows/cleanup-t41-t45-student-wording.yml
          git commit -m "GUIDES-T41-T45: keep Book Issue discovery wording neutral [skip guides]"
          git fetch origin Student-Guides
          git rebase origin/Student-Guides
          git push origin HEAD:Student-Guides
