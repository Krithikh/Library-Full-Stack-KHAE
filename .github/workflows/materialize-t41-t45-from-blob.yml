name: Materialize T41-T45 Book Issue Guides From Blob

on:
  push:
    branches: [ Student-Guides ]
    paths:
      - '.github/workflows/materialize-t41-t45-from-blob.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Student-Guides
        uses: actions/checkout@v4
        with:
          ref: Student-Guides
          fetch-depth: 0

      - name: Download stored ZIP blob and extract guide files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BLOB_SHA: 85a32bf3f696e660efe98e39bc24478d5e3c5306
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request, zipfile, shutil
          from pathlib import Path
          repo = os.environ['REPOSITORY']
          sha = os.environ['BLOB_SHA']
          token = os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          data = base64.b64decode(payload['content'])
          zip_path = Path('/tmp/t41-t45.zip')
          zip_path.write_bytes(data)
          out = Path('/tmp/t41-t45')
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError(f'Corrupt ZIP member: {bad}')
              z.extractall(out)
          src = out / 'T41_T45_Book_Issue_Guides'
          dst = Path('Documents/Student-Guides/Book-Issue')
          dst.mkdir(parents=True, exist_ok=True)
          for name in [
              'T41_Create_Book_Issue',
              'T42_Read_Book_Issue',
              'T43_Update_Book_Issue',
              'T44_Cancel_Book_Issue',
              'T45_Search_Book_Issue',
          ]:
              shutil.copytree(src / name, dst / name, dirs_exist_ok=True)
          shutil.copy2(src / 'T41_T45_manifest.json', dst / 'T41_T45_manifest.json')
          PY

      - name: Commit actual DOCX files and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KHAE Course Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Documents/Student-Guides/Book-Issue
          git rm .github/workflows/materialize-t41-t45-from-blob.yml
          git commit -m "GUIDES-T41-T45: add Book Issue student guide set [skip ci]"
          git push origin HEAD:Student-Guides
