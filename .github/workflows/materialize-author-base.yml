name: Materialize Author Presenter Base Layer

on:
  push:
    branches: [ Frontend-backend-Baseline ]
    paths:
      - 'automation/base/materialize_author_base.py'
      - '.github/workflows/materialize-author-base.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Frontend-backend-Baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize Author Presenter-owned files
        run: python automation/base/materialize_author_base.py
      - name: Commit generated Author base layer
        shell: bash
        run: |
          git config user.name "KHAE Course Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/backend.lib.mgmt/src/main/java/self/learning/backend/lib/mgmt/controller/rest/AuthorRestController.java
          git add backend/backend.lib.mgmt/src/main/java/self/learning/backend/lib/mgmt/controller/view/AuthorViewController.java
          git add backend/backend.lib.mgmt/src/main/java/self/learning/backend/lib/mgmt/service/presenter/PresenterAuthorListService.java
          git add backend/backend.lib.mgmt/src/main/resources/templates/author
          if git diff --cached --quiet; then
            echo "Author base layer already materialized."
            exit 0
          fi
          git commit -m "BASE-AUTHOR-01: add Presenter Author REST support and Thymeleaf CRUD/Search shell"
          git push origin HEAD:Frontend-backend-Baseline

  verify-backend:
    needs: materialize
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: library_fullstack
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d library_fullstack"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Frontend-backend-Baseline
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile and test backend with PostgreSQL
        working-directory: backend/backend.lib.mgmt
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/library_fullstack
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: bash mvnw --batch-mode --no-transfer-progress test
