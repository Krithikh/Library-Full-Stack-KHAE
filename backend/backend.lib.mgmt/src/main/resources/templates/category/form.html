<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Category Form - Thymeleaf</title>
  <style>body{font-family:Arial,sans-serif;margin:2rem;max-width:700px}label{display:block;margin-top:1rem}input{width:100%;padding:.55rem;box-sizing:border-box}.actions{margin-top:1.25rem;display:flex;gap:.75rem}</style>
</head>
<body>
  <h1 th:text="${mode == 'create'} ? 'Create Category - Thymeleaf' : 'Update Category - Thymeleaf'"></h1>
  <form th:object="${category}" th:action="${mode == 'create'} ? @{/library/categories} : @{/library/categories/{id}/edit(id=${categoryId})}" method="post">
    <label>Category Code</label>
    <input th:field="*{categoryCode}" required>
    <label>Category Name</label>
    <input th:field="*{categoryName}" required>
    <div class="actions"><button type="submit">Save</button><a th:href="@{/library/categories}">Cancel</a></div>
  </form>
</body>
</html>
