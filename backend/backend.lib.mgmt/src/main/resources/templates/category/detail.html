<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Category Detail - Thymeleaf</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library/categories}">Category List</a></div>
<div class="wrap">
  <h1>Category - Read by ID</h1>
  <dl class="record">
    <dt>Category ID</dt><dd th:text="${category.categoryId}"></dd>
    <dt>Category Code</dt><dd th:text="${category.categoryCode}"></dd>
    <dt>Category Name</dt><dd th:text="${category.categoryName}"></dd>
    <dt>Active</dt><dd th:text="${category.active}"></dd>
  </dl>
  <p>
    <a class="btn" th:href="@{/library/categories/{id}/edit(id=${category.categoryId})}">Update</a>
  </p>
  <form th:action="@{/library/categories/{id}/delete(id=${category.categoryId})}" method="post">
    <button type="submit">Deactivate</button>
  </form>
</div>
</body>
</html>
