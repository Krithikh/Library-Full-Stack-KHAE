<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Publisher Detail</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library/publishers}">Publisher List</a></div>
<div class="wrap">
  <h1>Publisher - Read by ID</h1>
  <div class="notice" th:if="${message != null}" th:text="${message}"></div>
  <div th:if="${record == null}" class="notice">No record was found for this ID.</div>

  <div th:if="${record != null}">
    <dl class="record">
      <dt>Publisher ID</dt><dd th:text="${record.publisherId}"></dd>
      <dt>Publisher Code</dt><dd th:text="${record.publisherCode}"></dd>
      <dt>Publisher Name</dt><dd th:text="${record.publisherName}"></dd>
      <dt>Active</dt><dd th:text="${record.active}"></dd>
    </dl>

    <div class="actions">
      <a class="btn" th:href="@{/library/publishers/{id}/edit(id=${record.publisherId})}">Update</a>
      <form th:if="${record.active}" method="post" th:action="@{/library/publishers/{id}/delete(id=${record.publisherId})}" style="display:inline">
        <button class="btn" type="submit">Deactivate</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
