<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Publisher List</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library}">Library Home</a></div>
<div class="wrap">
  <h1>Publisher CRUD + Search</h1>
  <p class="muted">Presenter-owned Thymeleaf page. Search behavior is supplied by the student SearchPublisherService implementation.</p>

  <div class="actions">
    <a class="btn" th:href="@{/library/publishers/new}">Create Publisher</a>
  </div>

  <form method="get" th:action="@{/library/publishers/search}" class="search-form">
    <label for="text">Search by Publisher Code or Name</label>
    <input id="text" name="text" th:value="${searchText}" placeholder="PUB-PRENTICE or Prentice">
    <button class="btn" type="submit">Search</button>
    <a class="btn" th:href="@{/library/publishers}">Clear</a>
  </form>

  <table>
    <thead>
    <tr>
      <th>ID</th><th>Code</th><th>Name</th><th>Active</th><th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${records}">
      <td th:text="${item.publisherId}"></td>
      <td th:text="${item.publisherCode}"></td>
      <td th:text="${item.publisherName}"></td>
      <td th:text="${item.active}"></td>
      <td>
        <a class="btn" th:href="@{/library/publishers/{id}(id=${item.publisherId})}">Read</a>
        <a class="btn" th:href="@{/library/publishers/{id}/edit(id=${item.publisherId})}">Update</a>
        <form th:if="${item.active}" method="post" th:action="@{/library/publishers/{id}/delete(id=${item.publisherId})}" style="display:inline">
          <button class="btn" type="submit">Deactivate</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
