<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Create Member</title></head>
<body>
<h1>Create Member - Thymeleaf</h1>
<p>The form is submitted to the Spring MVC controller, which calls CreateMemberService.</p>
<form th:action="@{/library/members}" th:object="${form}" method="post">
    <p><label>Registration Number <input th:field="*{registrationNumber}" /></label></p>
    <p><label>Full Name <input th:field="*{fullName}" /></label></p>
    <p><label>Email <input th:field="*{email}" /></label></p>
    <p><label>Department ID <input type="number" th:field="*{departmentId}" /></label></p>
    <button type="submit">Create Member</button>
    <a th:href="@{/library/members}">Cancel</a>
</form>
</body>
</html>
