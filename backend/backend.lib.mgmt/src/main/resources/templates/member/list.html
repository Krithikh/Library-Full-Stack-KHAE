<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Members</title></head>
<body>
<h1>Members - Thymeleaf Backend Page</h1>
<p>This page is rendered by Spring MVC. The Search action calls the student-owned SearchMemberService.</p>
<p><a th:href="@{/library}">Library Home</a> | <a th:href="@{/library/members/new}">Create Member</a></p>
<form th:action="@{/library/members/search}" method="get">
    <label>Search by registration number or name
        <input type="text" name="text" th:value="${searchText}" />
    </label>
    <button type="submit">Search</button>
    <a th:href="@{/library/members}">Clear</a>
</form>
<table border="1" cellpadding="6" cellspacing="0">
    <thead><tr><th>ID</th><th>Registration</th><th>Name</th><th>Email</th><th>Department ID</th><th>Active</th><th>Actions</th></tr></thead>
    <tbody>
    <tr th:each="record : ${records}">
        <td th:text="${record.memberId}"></td>
        <td th:text="${record.registrationNumber}"></td>
        <td th:text="${record.fullName}"></td>
        <td th:text="${record.email}"></td>
        <td th:text="${record.departmentId}"></td>
        <td th:text="${record.active}"></td>
        <td>
            <a th:href="@{/library/members/{id}(id=${record.memberId})}">Read</a>
            <a th:href="@{/library/members/{id}/edit(id=${record.memberId})}">Update</a>
            <form th:action="@{/library/members/{id}/delete(id=${record.memberId})}" method="post" style="display:inline">
                <button type="submit">Deactivate</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
