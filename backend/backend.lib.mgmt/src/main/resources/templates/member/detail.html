<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Member Detail</title></head>
<body>
<h1>Member Detail - Thymeleaf</h1>
<div th:if="${record != null}">
    <p><strong>ID:</strong> <span th:text="${record.memberId}"></span></p>
    <p><strong>Registration Number:</strong> <span th:text="${record.registrationNumber}"></span></p>
    <p><strong>Full Name:</strong> <span th:text="${record.fullName}"></span></p>
    <p><strong>Email:</strong> <span th:text="${record.email}"></span></p>
    <p><strong>Department ID:</strong> <span th:text="${record.departmentId}"></span></p>
    <p><strong>Active:</strong> <span th:text="${record.active}"></span></p>
    <p>
        <a th:href="@{/library/members/{id}/edit(id=${record.memberId})}">Update</a>
        <a th:href="@{/library/members}">Back to List</a>
    </p>
</div>
<div th:if="${record == null}">
    <p>Member not found.</p>
    <a th:href="@{/library/members}">Back to List</a>
</div>
</body>
</html>
