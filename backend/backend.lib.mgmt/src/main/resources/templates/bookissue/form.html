<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle}">Book Issue Form</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library/issues}">Book Issue List</a></div>
<div class="wrap">
  <h1 th:text="${pageTitle}">Book Issue Form</h1>
  <p class="muted">This Presenter-owned server-rendered form invokes the same student service used by the REST API.</p>
  <div class="notice" th:if="${message != null}" th:text="${message}"></div>

  <form method="post"
        th:object="${form}"
        th:action="${mode == 'edit'} ? @{/library/issues/{id}/edit(id=${bookIssueId})} : @{/library/issues}">
    <div>
      <label for="issueNumber">Issue Number</label>
      <input id="issueNumber" th:field="*{issueNumber}" placeholder="ISS-0001">
    </div>
    <div>
      <label for="membershipId">Membership ID</label>
      <input id="membershipId" type="number" th:field="*{membershipId}">
    </div>
    <div>
      <label for="bookCopyId">Book Copy ID</label>
      <input id="bookCopyId" type="number" th:field="*{bookCopyId}">
    </div>
    <div>
      <label for="reservationId">Reservation ID (Optional)</label>
      <input id="reservationId" type="number" th:field="*{reservationId}">
    </div>
    <div>
      <label for="issueDate">Issue Date</label>
      <input id="issueDate" type="date" th:field="*{issueDate}">
    </div>
    <div>
      <label for="dueDate">Due Date</label>
      <input id="dueDate" type="date" th:field="*{dueDate}">
    </div>
    <div>
      <label for="status">Status</label>
      <select id="status" th:field="*{status}">
        <option value="ACTIVE">ACTIVE</option>
        <option value="RETURNED">RETURNED</option>
        <option value="CANCELLED">CANCELLED</option>
      </select>
    </div>
    <div class="actions">
      <button class="btn" type="submit" th:text="${mode == 'edit'} ? 'Update Book Issue' : 'Create Book Issue'">Save</button>
      <a class="btn" th:href="@{/library/issues}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
