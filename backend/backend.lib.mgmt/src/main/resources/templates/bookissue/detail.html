<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Book Issue Detail</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library/issues}">Book Issue List</a></div>
<div class="wrap">
  <h1>Book Issue - Read by ID</h1>
  <div class="notice" th:if="${message != null}" th:text="${message}"></div>
  <div th:if="${record == null}" class="notice">No Book Issue was found for this ID.</div>

  <div th:if="${record != null}">
    <dl class="record">
      <dt>Book Issue ID</dt><dd th:text="${record.bookIssueId}"></dd>
      <dt>Issue Number</dt><dd th:text="${record.issueNumber}"></dd>
      <dt>Membership ID</dt><dd th:text="${record.membershipId}"></dd>
      <dt>Book Copy ID</dt><dd th:text="${record.bookCopyId}"></dd>
      <dt>Reservation ID</dt><dd th:text="${record.reservationId}"></dd>
      <dt>Issue Date</dt><dd th:text="${record.issueDate}"></dd>
      <dt>Due Date</dt><dd th:text="${record.dueDate}"></dd>
      <dt>Status</dt><dd th:text="${record.status}"></dd>
    </dl>

    <div class="actions" th:if="${record.status == 'ACTIVE'}">
      <a class="btn" th:href="@{/library/issues/{id}/edit(id=${record.bookIssueId})}">Update</a>
      <form method="post" th:action="@{/library/issues/{id}/delete(id=${record.bookIssueId})}" style="display:inline">
        <button class="btn" type="submit">Cancel Issue</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
