<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Fine Detail</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library/fines}">Fine List</a></div>
<div class="wrap">
  <h1>Fine Detail</h1>
  <div class="notice" th:if="${message != null}" th:text="${message}"></div>

  <div th:if="${record == null}" class="notice">
    Fine was not found.
  </div>

  <table th:if="${record != null}">
    <tbody>
      <tr><th>ID</th><td th:text="${record.fineId}"></td></tr>
      <tr><th>Fine Number</th><td th:text="${record.fineNumber}"></td></tr>
      <tr><th>Book Return ID</th><td th:text="${record.bookReturnId}"></td></tr>
      <tr><th>Membership ID</th><td th:text="${record.membershipId}"></td></tr>
      <tr><th>Amount</th><td th:text="${record.amount}"></td></tr>
      <tr><th>Outstanding Amount</th><td th:text="${record.outstandingAmount}"></td></tr>
      <tr><th>Status</th><td th:text="${record.status}"></td></tr>
    </tbody>
  </table>

  <div class="actions" th:if="${record != null}">
    <a class="btn" th:if="${record.status != 'VOID'}" th:href="@{/library/fines/{id}/edit(id=${record.fineId})}">Update</a>
    <form th:if="${record.status != 'VOID'}" method="post" th:action="@{/library/fines/{id}/delete(id=${record.fineId})}" style="display:inline">
      <button class="btn" type="submit">Void Fine</button>
    </form>
    <a class="btn" th:href="@{/library/fines}">Back to List</a>
  </div>
</div>
</body>
</html>
