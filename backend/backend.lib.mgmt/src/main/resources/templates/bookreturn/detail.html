<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Book Return Detail</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library/returns}">Book Return List</a></div>
<div class="wrap">
  <h1>Book Return - Read by ID</h1>
  <div class="notice" th:if="${message != null}" th:text="${message}"></div>
  <div th:if="${record == null}" class="notice">No Book Return was found for this ID.</div>

  <div th:if="${record != null}">
    <dl class="record">
      <dt>Book Return ID</dt><dd th:text="${record.bookReturnId}"></dd>
      <dt>Return Number</dt><dd th:text="${record.returnNumber}"></dd>
      <dt>Book Issue ID</dt><dd th:text="${record.bookIssueId}"></dd>
      <dt>Return Date</dt><dd th:text="${record.returnDate}"></dd>
      <dt>Status</dt><dd th:text="${record.status}"></dd>
    </dl>

    <div class="actions" th:if="${record.status != 'VOID'}">
      <a class="btn" th:href="@{/library/returns/{id}/edit(id=${record.bookReturnId})}">Update</a>
      <form method="post" th:action="@{/library/returns/{id}/delete(id=${record.bookReturnId})}" style="display:inline">
        <button class="btn" type="submit">Void Return</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
