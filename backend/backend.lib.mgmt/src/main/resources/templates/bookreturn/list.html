<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Book Return List</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library}">Library Home</a></div>
<div class="wrap">
  <h1>Book Return CRUD + Search</h1>
  <p class="muted">Presenter-owned Thymeleaf page. Search behavior is supplied by the student SearchBookReturnService implementation.</p>

  <div class="actions">
    <a class="btn" th:href="@{/library/returns/new}">Create Book Return</a>
  </div>

  <form method="get" th:action="@{/library/returns/search}" class="search-form">
    <label for="text">Search by Return Number</label>
    <input id="text" name="text" th:value="${searchText}" placeholder="RET-0001">
    <button class="btn" type="submit">Search</button>
    <a class="btn" th:href="@{/library/returns}">Clear</a>
  </form>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Return Number</th>
        <th>Book Issue ID</th>
        <th>Return Date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="item : ${records}">
        <td th:text="${item.bookReturnId}"></td>
        <td th:text="${item.returnNumber}"></td>
        <td th:text="${item.bookIssueId}"></td>
        <td th:text="${item.returnDate}"></td>
        <td th:text="${item.status}"></td>
        <td>
          <a class="btn" th:href="@{/library/returns/{id}(id=${item.bookReturnId})}">Read</a>
          <a class="btn" th:if="${item.status != 'VOID'}" th:href="@{/library/returns/{id}/edit(id=${item.bookReturnId})}">Update</a>
          <form th:if="${item.status != 'VOID'}" method="post" th:action="@{/library/returns/{id}/delete(id=${item.bookReturnId})}" style="display:inline">
            <button class="btn" type="submit">Void Return</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
