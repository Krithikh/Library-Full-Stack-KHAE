<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Membership Detail</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library/memberships}">Membership List</a></div>
<div class="wrap">
  <h1>Membership - Read by ID</h1>
  <div class="notice" th:if="${message != null}" th:text="${message}"></div>
  <div th:if="${record == null}" class="notice">No record was found for this ID.</div>

  <div th:if="${record != null}">
    <dl class="record">
      <dt>Membership ID</dt><dd th:text="${record.membershipId}"></dd>
      <dt>Membership Number</dt><dd th:text="${record.membershipNumber}"></dd>
      <dt>Member ID</dt><dd th:text="${record.memberId}"></dd>
      <dt>Membership Type</dt><dd th:text="${record.membershipType}"></dd>
      <dt>Status</dt><dd th:text="${record.status}"></dd>
    </dl>

    <div class="actions" th:if="${record.status == 'ACTIVE'}">
      <a class="btn" th:href="@{/library/memberships/{id}/edit(id=${record.membershipId})}">Update</a>
      <form method="post" th:action="@{/library/memberships/{id}/delete(id=${record.membershipId})}" style="display:inline">
        <button class="btn" type="submit">Deactivate</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
