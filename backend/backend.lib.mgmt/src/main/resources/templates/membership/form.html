<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle}">Membership Form</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library/memberships}">Membership List</a></div>
<div class="wrap">
  <h1 th:text="${pageTitle}">Membership Form</h1>
  <p class="muted">This server-rendered form invokes the same student service used by the REST API.</p>
  <div class="notice" th:if="${message != null}" th:text="${message}"></div>

  <form method="post"
        th:object="${form}"
        th:action="${mode == 'edit'} ? @{/library/memberships/{id}/edit(id=${membershipId})} : @{/library/memberships}">
    <div>
      <label for="membershipNumber">Membership Number</label>
      <input id="membershipNumber" th:field="*{membershipNumber}" placeholder="MEM-0001">
    </div>
    <div>
      <label for="memberId">Member ID</label>
      <input id="memberId" type="number" th:field="*{memberId}">
    </div>
    <div>
      <label for="membershipType">Membership Type</label>
      <select id="membershipType" th:field="*{membershipType}">
        <option value="STUDENT">STUDENT</option>
        <option value="STAFF">STAFF</option>
      </select>
    </div>
    <div>
      <label for="status">Status</label>
      <select id="status" th:field="*{status}">
        <option value="ACTIVE">ACTIVE</option>
        <option value="INACTIVE">INACTIVE</option>
      </select>
    </div>
    <div class="actions">
      <button class="btn" type="submit" th:text="${mode == 'edit'} ? 'Update Membership' : 'Create Membership'">Save</button>
      <a class="btn" th:href="@{/library/memberships}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
