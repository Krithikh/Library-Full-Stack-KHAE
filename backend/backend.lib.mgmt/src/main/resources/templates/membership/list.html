<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Membership List</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library}">Library Home</a></div>
<div class="wrap">
  <h1>Membership CRUD + Search</h1>
  <p class="muted">Presenter-owned Thymeleaf page. Search behavior is supplied by the student SearchMembershipService implementation.</p>

  <div class="actions">
    <a class="btn" th:href="@{/library/memberships/new}">Create Membership</a>
  </div>

  <form method="get" th:action="@{/library/memberships/search}" class="search-form">
    <label for="text">Search by Membership Number or Type</label>
    <input id="text" name="text" th:value="${searchText}" placeholder="MEM-0001 or STUDENT">
    <button class="btn" type="submit">Search</button>
    <a class="btn" th:href="@{/library/memberships}">Clear</a>
  </form>

  <table>
    <thead><tr><th>ID</th><th>Number</th><th>Member ID</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>
      <tr th:each="item : ${records}">
        <td th:text="${item.membershipId}"></td>
        <td th:text="${item.membershipNumber}"></td>
        <td th:text="${item.memberId}"></td>
        <td th:text="${item.membershipType}"></td>
        <td th:text="${item.status}"></td>
        <td>
          <a class="btn" th:href="@{/library/memberships/{id}(id=${item.membershipId})}">Read</a>
          <a class="btn" th:if="${item.status == 'ACTIVE'}" th:href="@{/library/memberships/{id}/edit(id=${item.membershipId})}">Update</a>
          <form th:if="${item.status == 'ACTIVE'}" method="post" th:action="@{/library/memberships/{id}/delete(id=${item.membershipId})}" style="display:inline">
            <button class="btn" type="submit">Deactivate</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
