<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Department Management</title><style>body{font-family:Arial,sans-serif;margin:2rem;background:#f7f8fa}.wrap{max-width:1000px;margin:auto;background:white;padding:1.5rem}table{width:100%;border-collapse:collapse;margin-top:1rem}th,td{border:1px solid #ddd;padding:.6rem}th{background:#eef3f8}.bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.danger{color:#9b1c1c}</style></head><body><div class="wrap"><h1>Department Management - Thymeleaf</h1><p>This page is server-rendered. It calls the same Department service interfaces used by the REST application.</p><div class="bar"><a href="/library">Library Home</a><a href="/library/departments/new">Create Department</a><form method="get" action="/library/departments/search"><input name="text" th:value="${searchText}" placeholder="Search code or name"><button type="submit">Search</button></form><a href="/library/departments">Show All</a></div><table><thead><tr><th>ID</th><th>Code</th><th>Name</th><th>Active</th><th>Actions</th></tr></thead><tbody><tr th:each="r : ${records}"><td th:text="${r.departmentId}"></td><td th:text="${r.departmentCode}"></td><td th:text="${r.departmentName}"></td><td th:text="${r.active}"></td><td><a th:href="@{'/library/departments/' + ${r.departmentId}}">Read</a> <a th:href="@{'/library/departments/' + ${r.departmentId} + '/edit'}">Update</a> <form th:action="@{'/library/departments/' + ${r.departmentId} + '/delete'}" method="post" style="display:inline"><button class="danger" type="submit">Deactivate</button></form></td></tr></tbody></table></div></body></html>
