<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Book List</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library}">Library Home</a></div>
<div class="wrap">
  <h1>Book CRUD + Search</h1>
  <p class="muted">Presenter-owned Thymeleaf page. Search behavior is supplied by the student SearchBookService implementation.</p>

  <div class="actions">
    <a class="btn" th:href="@{/library/books/new}">Create Book</a>
  </div>

  <form method="get" th:action="@{/library/books/search}" class="search-form">
    <label for="text">Search by ISBN or Title</label>
    <input id="text" name="text" th:value="${searchText}" placeholder="9780132350884 or Clean Code">
    <button class="btn" type="submit">Search</button>
    <a class="btn" th:href="@{/library/books}">Clear</a>
  </form>

  <table>
    <thead>
      <tr>
        <th>ID</th><th>ISBN</th><th>Title</th><th>Author</th><th>Category</th><th>Publisher</th><th>Active</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="item : ${records}">
        <td th:text="${item.bookId}"></td>
        <td th:text="${item.isbn}"></td>
        <td th:text="${item.title}"></td>
        <td th:text="${item.authorId}"></td>
        <td th:text="${item.categoryId}"></td>
        <td th:text="${item.publisherId}"></td>
        <td th:text="${item.active}"></td>
        <td>
          <a class="btn" th:href="@{/library/books/{id}(id=${item.bookId})}">Read</a>
          <a class="btn" th:href="@{/library/books/{id}/edit(id=${item.bookId})}">Update</a>
          <form th:if="${item.active}" method="post" th:action="@{/library/books/{id}/delete(id=${item.bookId})}" style="display:inline">
            <button class="btn" type="submit">Deactivate</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
