<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle}">Book Form</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library/books}">Book List</a></div>
<div class="wrap">
  <h1 th:text="${pageTitle}">Book Form</h1>
  <p class="muted">This server-rendered form invokes the same student service used by the REST API.</p>
  <div class="notice" th:if="${message != null}" th:text="${message}"></div>

  <form method="post"
        th:object="${form}"
        th:action="${mode == 'edit'} ? @{/library/books/{id}/edit(id=${bookId})} : @{/library/books}">
    <div>
      <label for="isbn">ISBN</label>
      <input id="isbn" th:field="*{isbn}" placeholder="9780132350884">
    </div>
    <div>
      <label for="title">Title</label>
      <input id="title" th:field="*{title}" placeholder="Clean Code">
    </div>
    <div>
      <label for="authorId">Author ID</label>
      <input id="authorId" type="number" th:field="*{authorId}">
    </div>
    <div>
      <label for="categoryId">Category ID</label>
      <input id="categoryId" type="number" th:field="*{categoryId}">
    </div>
    <div>
      <label for="publisherId">Publisher ID</label>
      <input id="publisherId" type="number" th:field="*{publisherId}">
    </div>
    <div class="actions">
      <button class="btn" type="submit" th:text="${mode == 'edit'} ? 'Update Book' : 'Create Book'">Save</button>
      <a class="btn" th:href="@{/library/books}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
