<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Book Copy List</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library}">Library Home</a></div>
<div class="wrap">
  <h1>Book Copy CRUD + Search</h1>
  <p class="muted">Presenter-owned Thymeleaf page. Search behavior is supplied by the student SearchBookCopyService implementation.</p>

  <div class="actions">
    <a class="btn" th:href="@{/library/book-copies/new}">Add Book Copy</a>
  </div>

  <form method="get" th:action="@{/library/book-copies/search}" class="search-form">
    <label for="text">Search by Accession Number</label>
    <input id="text" name="text" th:value="${searchText}" placeholder="ACC-0001">
    <button class="btn" type="submit">Search</button>
    <a class="btn" th:href="@{/library/book-copies}">Clear</a>
  </form>

  <table>
    <thead>
      <tr><th>ID</th><th>Accession Number</th><th>Book ID</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody>
      <tr th:each="item : ${records}">
        <td th:text="${item.bookCopyId}"></td>
        <td th:text="${item.accessionNumber}"></td>
        <td th:text="${item.bookId}"></td>
        <td th:text="${item.status}"></td>
        <td>
          <a class="btn" th:href="@{/library/book-copies/{id}(id=${item.bookCopyId})}">Read</a>
          <a class="btn" th:if="${item.status != 'WITHDRAWN'}" th:href="@{/library/book-copies/{id}/edit(id=${item.bookCopyId})}">Update</a>
          <form th:if="${item.status != 'WITHDRAWN'}" method="post" th:action="@{/library/book-copies/{id}/delete(id=${item.bookCopyId})}" style="display:inline">
            <button class="btn" type="submit">Withdraw</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
