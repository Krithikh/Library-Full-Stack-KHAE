<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle}">Book Copy Form</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library/book-copies}">Book Copy List</a></div>
<div class="wrap">
  <h1 th:text="${pageTitle}">Book Copy Form</h1>
  <p class="muted">This server-rendered form invokes the same student service used by the REST API.</p>
  <div class="notice" th:if="${message != null}" th:text="${message}"></div>

  <form method="post"
        th:object="${form}"
        th:action="${mode == 'edit'} ? @{/library/book-copies/{id}/edit(id=${bookCopyId})} : @{/library/book-copies}">
    <div>
      <label for="accessionNumber">Accession Number</label>
      <input id="accessionNumber" th:field="*{accessionNumber}" placeholder="ACC-0001">
    </div>
    <div>
      <label for="bookId">Book ID</label>
      <input id="bookId" type="number" th:field="*{bookId}">
    </div>
    <div>
      <label for="status">Status</label>
      <select id="status" th:field="*{status}">
        <option value="AVAILABLE">AVAILABLE</option>
        <option value="ISSUED">ISSUED</option>
        <option value="WITHDRAWN">WITHDRAWN</option>
      </select>
    </div>
    <div class="actions">
      <button class="btn" type="submit" th:text="${mode == 'edit'} ? 'Update Book Copy' : 'Add Book Copy'">Save</button>
      <a class="btn" th:href="@{/library/book-copies}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
