<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Reservation Detail</title>
  <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
<div class="top"><a th:href="@{/library/reservations}">Reservation List</a></div>
<div class="wrap">
  <h1>Reservation Detail</h1>
  <div class="notice" th:if="${message != null}" th:text="${message}"></div>

  <div th:if="${record == null}" class="notice">
    Reservation was not found.
  </div>

  <table th:if="${record != null}">
    <tbody>
      <tr><th>ID</th><td th:text="${record.reservationId}"></td></tr>
      <tr><th>Reservation Number</th><td th:text="${record.reservationNumber}"></td></tr>
      <tr><th>Membership ID</th><td th:text="${record.membershipId}"></td></tr>
      <tr><th>Book ID</th><td th:text="${record.bookId}"></td></tr>
      <tr><th>Reserved Date</th><td th:text="${record.reservedDate}"></td></tr>
      <tr><th>Status</th><td th:text="${record.status}"></td></tr>
    </tbody>
  </table>

  <div class="actions" th:if="${record != null}">
    <a class="btn" th:if="${record.status == 'ACTIVE'}" th:href="@{/library/reservations/{id}/edit(id=${record.reservationId})}">Update</a>
    <form th:if="${record.status == 'ACTIVE'}" method="post" th:action="@{/library/reservations/{id}/delete(id=${record.reservationId})}" style="display:inline">
      <button class="btn" type="submit">Cancel Reservation</button>
    </form>
    <a class="btn" th:href="@{/library/reservations}">Back to List</a>
  </div>
</div>
</body>
</html>
